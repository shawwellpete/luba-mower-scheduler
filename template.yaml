- sensor:
    - name: Mowing Block Reason
      unique_id: mowing_block_reason
      state: >-
        {{ 'Manual block' if is_state('input_boolean.do_not_mow','on') else
        state_attr('binary_sensor.mowing_conditions_blocked','reason') | default('Clear',true) }}
