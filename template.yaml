- sensor:
    - name: Mower Last Lawn
      unique_id: mower_last_lawn
      icon: mdi:robot-mower
      state: |-
        {% set active = state_attr('sensor.mowing_session_log','active') or {} %}
        {% set sessions = state_attr('sensor.mowing_session_log','sessions') or [] %}
        {{ active.get('lawn') or (sessions[0].lawn if sessions else 'No lawn recorded') }}
      attributes:
        since: >-
          {% set active = state_attr('sensor.mowing_session_log','active') or {} %}

          {% set sessions = state_attr('sensor.mowing_session_log','sessions') or [] %}

          {% set ts = as_timestamp(active.get('start') or (sessions[0].start if sessions else none), 0) %}

          {% set minutes = ((now().timestamp() - ts) / 60) | int if ts else 0 %}

          {% if not ts %}unknown{% elif minutes < 60 %}{{ minutes }}m{% elif minutes < 1440 %}{{ minutes // 60
          }}h{% else %}{{ minutes // 1440 }}d{% endif %}
