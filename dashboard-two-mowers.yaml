  - type: grid
    columns: 2
    square: false
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: lawn_mower.mower
            primary: Mower · {{ states('lawn_mower.mower') | title }}
            secondary: >-
              {% if is_state('lawn_mower.mower','mowing') %}{{ states('sensor.mower_progress') }}% · {{
              states('sensor.mower_elapsed_time') }} min elapsed

              {% else %}Last: {{ states('sensor.mower_last_lawn') }}{% endif %}

              {% set err = states('sensor.mower_last_error') %}{% if err | lower not in
              ['ok','none','unknown','unavailable',''] and states('lawn_mower.mower') not in
              ['mowing','docked','returning'] %}{{ err }}{% endif %}
            multiline_secondary: true
            icon: mdi:robot-mower
            icon_color: '{{ ''green'' if is_state(''lawn_mower.mower'',''mowing'') else ''grey'' }}'
            tap_action:
              action: more-info
            card_mod:
              style: >-
                ha-card { height: 112px; min-height: 112px; max-height: 112px; box-sizing: border-box;
                overflow-y: auto; overflow-x: hidden; }
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.mower_battery
                icon: mdi:battery
              - type: action
                icon: mdi:pause
                tap_action:
                  action: call-service
                  service: lawn_mower.pause
                  target:
                    entity_id: lawn_mower.mower
              - type: action
                icon: mdi:home-import-outline
                tap_action:
                  action: call-service
                  service: lawn_mower.dock
                  target:
                    entity_id: lawn_mower.mower
          - type: custom:map-card
            focus_entity: device_tracker.mower
            zoom: 19
            card_size: 12
            plugins:
              - name: geoJson
                url: /local/community/ha-mammotion-assets/dist/geojson.js
                options:
                  entity_id: lawn_mower.mower
            entities:
              - entity: device_tracker.mower
                display: marker
                size: 20
                history_show_lines: false
                history_show_dots: false
            card_mod:
              style: '.geojson-text-label, .geojson-label-text { display: none !important; }'
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: lawn_mower.mower_2
            primary: Mower 2 · {{ states('lawn_mower.mower_2') | title }}
            secondary: >-
              {% if is_state('lawn_mower.mower_2','mowing') %}{{ states('sensor.mower_2_progress') }}% · {{
              states('sensor.mower_2_elapsed_time') }} min elapsed

              {% else %}Last: {{ states('sensor.mower_2_last_lawn') }}{% endif %}

              {% set err = states('sensor.mower_2_last_error') %}{% if err | lower not in
              ['ok','none','unknown','unavailable',''] and states('lawn_mower.mower_2') not in
              ['mowing','docked','returning'] %}{{ err }}{% endif %}
            multiline_secondary: true
            icon: mdi:robot-mower
            icon_color: '{{ ''green'' if is_state(''lawn_mower.mower_2'',''mowing'') else ''grey'' }}'
            tap_action:
              action: more-info
            card_mod:
              style: >-
                ha-card { height: 112px; min-height: 112px; max-height: 112px; box-sizing: border-box;
                overflow-y: auto; overflow-x: hidden; }
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.mower_2_battery
                icon: mdi:battery
              - type: action
                icon: mdi:pause
                tap_action:
                  action: call-service
                  service: lawn_mower.pause
                  target:
                    entity_id: lawn_mower.mower_2
              - type: action
                icon: mdi:home-import-outline
                tap_action:
                  action: call-service
                  service: lawn_mower.dock
                  target:
                    entity_id: lawn_mower.mower_2
          - type: custom:map-card
            focus_entity: device_tracker.mower_2
            zoom: 19
            card_size: 12
            plugins:
              - name: geoJson
                url: /local/community/ha-mammotion-assets/dist/geojson.js
                options:
                  entity_id: lawn_mower.mower_2
            entities:
              - entity: device_tracker.mower_2
                display: marker
                size: 20
                history_show_lines: false
                history_show_dots: false
            card_mod:
              style: '.geojson-text-label, .geojson-label-text { display: none !important; }'
