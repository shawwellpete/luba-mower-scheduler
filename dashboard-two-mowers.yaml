                      - width: 100%
                      - min-width: '0'
                custom_fields:
                  content: >-
                    [[[


                    const sessions = ['sensor.mowing_session_log','sensor.mowing_session_log_2'].flatMap(id =>
                    { const data = states[id]?.attributes?.sessions; return Array.isArray(data) ? data : [];
                    });

                    const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
                    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

                    const stamp = s => Date.parse(s.end) || 0;

                    const date = ts => new Intl.DateTimeFormat('en-GB', {timeZone:hass.config.time_zone,
                    day:'numeric',month:'short'}).format(ts);

                    const time = ts => new Intl.DateTimeFormat('en-GB', {timeZone:hass.config.time_zone,
                    hour:'2-digit',minute:'2-digit'}).format(ts);

                    const duration = d => {d = Math.max(0, Math.floor(Number(d) || 0)); return d < 60 ? d +
                    'm' : Math.floor(d/60) + 'h' + (d%60 ? ' ' + d%60 + 'm' : '');};

                    const status = s =>
                    ({completed:['complete','Complete'],partial:['partial','Partial'],error:['error','Error'],cancelled:['stopped','Cancelled'],canceled:['stopped','Cancelled'],aborted:['stopped','Stopped']})[s]
                    || ['stopped','Stopped'];

                    const lawnName = name => name === 'Unknown' ? 'Unassigned' : String(name ||
                    'Unassigned').replace(/\b(Grass|Lawn)\b/g, s => s.toLowerCase());

                    const week = Date.now() - 7*86400000;


                    const month = Date.now() - 30*86400000;

                    const lawns = [...new Set(['Lawn 1','Lawn 2','Lawn 3', ...sessions.map(s => s.lawn ||
                    'Unknown')].map(s => s.trim().toLowerCase()))].map(s => s === 'unknown' ? 'Unknown' :
                    s.replace(/^./, c => c.toUpperCase()));

                    const rows = lawns.map(lawn => {
                     const items = sessions.filter(s => String(s.lawn || 'Unknown').trim().toLowerCase() === lawn.toLowerCase()).sort((a,b) => stamp(b)-stamp(a));
                     const last = items[0];
                     const average = items.length ? Math.floor(items.reduce((n,s)=>n+(Number(s.duration_min)||0),0)/items.length) : null;
                     const [kind,label] = last ? status(last.outcome) : ['stopped','No sessions'];
                     return '<tr><th scope="row">' + esc(lawnName(lawn)) + '</th><td>' + items.filter(s=>stamp(s)>week).length + '</td><td>' + items.filter(s=>stamp(s)>month).length + '</td><td>' + (average === null ? '—' : duration(average)) + '</td><td class="last">' + (last ? date(stamp(last)) + '<span class="last-status ' + kind + '">' + label + '</span>' : '—') + '</td></tr>';
                    }).join('');

                    return '<div class="heading"><h2>By lawn</h2></div><table aria-label="Mowing sessions by
                    lawn"><thead><tr><th scope="col">Lawn</th><th scope="col">7d</th><th
                    scope="col">30d</th><th scope="col">Avg</th><th
                    scope="col">Latest</th></tr></thead><tbody>' + rows + '</tbody></table><p
                    class="footnote">Recorded sessions · average across available history</p>';


                    ]]]
                extra_styles: >

                  .heading
                  {display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;}

                  h2 {font-size:17px;font-weight:600;line-height:1.4;margin:0;letter-spacing:0;}

