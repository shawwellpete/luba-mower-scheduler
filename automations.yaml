# Single-mower scheduler with retry-before-dispatch, stale-time recovery and idle-only task synchronization.
- id: lawn_1_scheduler
  alias: Lawn 1 Scheduler
  mode: single
  triggers:
    - trigger: time
      at: input_datetime.lawn_1_next_time
  conditions:
    - condition: state
      entity_id: input_boolean.mowing_automation_enabled
      state: "on"
    - condition: template
      value_template: "{{ states('input_select.lawn_1_schedule') in ['once per week', 'twice per week'] }}"
  actions:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.lawn_1_next_time
      data:
        datetime: "{{ (now() + timedelta(hours=1)).strftime('%Y-%m-%d %H:%M:%S') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ is_state('input_boolean.do_not_mow','off') and
                is_state('binary_sensor.mowing_conditions_blocked','off') and states('lawn_mower.mower') in
                ['docked','idle'] and is_state('script.mow_lawn','off') }}
          sequence:
            - action: script.mow_lawn_1
              data:
                source: schedule
