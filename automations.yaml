- id: mower_recover_overdue_schedules
  alias: "Mower: recover overdue schedules"
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: input_boolean.mowing_automation_enabled
      to: "on"
    - trigger: time_pattern
      minutes: /15
    - trigger: state
      entity_id:
        - input_select.lawn_1_schedule
        - input_select.lawn_2_schedule
        - input_select.lawn_3_schedule
  conditions:
    - condition: state
      entity_id: input_boolean.mowing_automation_enabled
      state: "on"
  actions:
    - action: script.reconcile_mow_next_times
- id: mower_task_buttons_sync
  alias: "Mower: restore missing task buttons"
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.mower_task_buttons_blocked
      to: "on"
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ states['button.mower_synchronize_schedules'] is not none and
                states('button.mower_synchronize_schedules') != 'unavailable' }}
          sequence:
            - action: button.press
              target:
                entity_id: button.mower_synchronize_schedules
              continue_on_error: true
            - delay: "00:02:00"
            - if:
                - condition: state
                  entity_id: binary_sensor.mower_task_buttons_blocked
                  state: "on"
              then:
                - action: persistent_notification.create
                  data:
                    notification_id: mower_task_sync
                    title: Mowing tasks still unavailable
                    message: >-
                      Schedule synchronization did not restore every task. Check the integration and
                      saved-task entity names.
      default:
        - action: persistent_notification.create
          data:
            notification_id: mower_task_sync
            title: Mowing tasks unavailable
            message: >-
              Task buttons and the schedule-sync button are unavailable. Check the mower connection and
              configured entity names.
