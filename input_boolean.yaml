# Scheduler switches. do_not_mow is a manual block; computed weather/night restrictions never clear it.
mowing_automation_enabled:
  name: Mowing Automation Enabled
  icon: mdi:robot-mower
do_not_mow:
  name: Manual Mowing Block
  icon: mdi:robot-mower-off
block_night_mowing:
  name: Block Night Mowing
  icon: mdi:weather-night
block_rain_mowing:
  name: Block Rain Mowing
  icon: mdi:weather-rainy
