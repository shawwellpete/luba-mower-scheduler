# Built-in-card dashboard. Replace generic mower entities. No location history or private coordinates.
title: Mower
path: mower
icon: mdi:robot-mower
cards:
  - type: entities
    title: Mowing Controls
    entities:
      - entity: input_boolean.mowing_automation_enabled
        name: Scheduler enabled
      - entity: input_boolean.do_not_mow
        name: Manual mowing block
      - entity: input_boolean.block_night_mowing
        name: Block night mowing
      - entity: input_boolean.block_rain_mowing
        name: Block rain mowing
      - entity: binary_sensor.mowing_conditions_blocked
        name: Weather/night restriction
      - type: button
        name: Recover overdue schedules
        icon: mdi:calendar-refresh
        tap_action:
          action: perform-action
          perform_action: script.reconcile_mow_next_times
      - entity: sensor.mowing_block_reason
        name: Reason
  - type: glance
    title: Mower
    entities:
      - entity: lawn_mower.mower
        name: State
      - entity: sensor.mower_battery
        name: Battery
      - entity: sensor.mower_last_lawn
        name: Last lawn
  - type: entities
    title: Mowing history
    entities:
      - entity: sensor.mowing_session_log
        name: Recorded sessions
      - entity: binary_sensor.mower_task_buttons_blocked
        name: Task buttons need attention
  - type: map
    title: Mower Location
    entities:
      - device_tracker.mower
    hours_to_show: 0
  - type: picture-entity
    title: Mower Camera
    entity: camera.mower
    camera_view: live
    show_state: false
  - type: entities
    title: Lawn 1
    entities:
      - entity: input_select.lawn_1_schedule
        name: Frequency
      - entity: input_datetime.lawn_1_next_time
        name: Next mow
      - entity: sensor.lawn_1_days_since_mow
        name: Days since mow
      - type: button
        name: Mow Lawn 1 now
        icon: mdi:robot-mower
        tap_action:
          action: perform-action
          perform_action: script.mow_lawn_1
  - type: entities
    title: Lawn 2
    entities:
      - entity: input_select.lawn_2_schedule
        name: Frequency
      - entity: input_datetime.lawn_2_next_time
        name: Next mow
      - entity: sensor.lawn_2_days_since_mow
        name: Days since mow
      - type: button
        name: Mow Lawn 2 now
        icon: mdi:robot-mower
        tap_action:
          action: perform-action
          perform_action: script.mow_lawn_2
  - type: entities
    title: Lawn 3
    entities:
      - entity: input_select.lawn_3_schedule
        name: Frequency
      - entity: input_datetime.lawn_3_next_time
        name: Next mow
      - entity: sensor.lawn_3_days_since_mow
        name: Days since mow
      - type: button
        name: Mow Lawn 3 now
        icon: mdi:robot-mower
        tap_action:
          action: perform-action
          perform_action: script.mow_lawn_3
